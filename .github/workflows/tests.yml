name: Testes

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de responsividade (celulares, tablets e desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
